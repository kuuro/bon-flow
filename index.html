<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bon Day - Flow Writer</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1f2a4d;--mut:#6b7597;--line:#dde3f3;--pri:#3a5fe5;--pri-d:#2641b0;--good:#2a9d63;--fair:#d99a10;--bad:#d9423f}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button{font:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit;width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff}
input:focus,textarea:focus,select:focus{outline:2px solid #b9c8ff;border-color:var(--pri)}
textarea{resize:vertical;min-height:34px;overflow:hidden}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}
#top{display:flex;align-items:center;gap:10px;padding:8px 14px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
#top h1{margin:0;font-size:16px}
.tabs{display:flex;gap:4px;margin-left:8px}
.tab{padding:6px 14px;border:0;border-radius:8px;background:transparent;color:var(--mut);font-weight:600}
.tab.on{background:#e8eeff;color:var(--pri-d)}
.sp{flex:1}
.btn{padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
.btn:hover{background:#f0f3ff}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:var(--pri-d)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:2px 8px;font-size:12px}
.badge{padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700}
.badge.ok{background:#dcf5e5;color:#14633c}.badge.err{background:#ffe5e1;color:#962724}.badge.warn{background:#fff3cf;color:#7a5200}
#saved{font-size:12px;color:var(--mut)}
main{flex:1;display:grid;grid-template-columns:250px minmax(0,1fr) 410px;min-height:0}
main.wide{grid-template-columns:250px minmax(0,1fr)}
main.wide #preview{display:none}
#tree{overflow:auto;background:#fff;border-right:1px solid var(--line);padding:8px}
#center{overflow:auto;padding:16px 20px 60px}
#preview{overflow:auto;background:#eef1fa;border-left:1px solid var(--line);padding:12px}
.wrap{max-width:820px;margin:0 auto}
.trow{padding:5px 8px;border-radius:7px;cursor:pointer;display:flex;align-items:center;gap:6px;color:var(--ink)}
.trow:hover{background:#f0f3ff}
.trow.on{background:#e1e9ff;font-weight:700}
.trow.lv{margin-top:8px;font-weight:700}
.trow.sc{padding-left:18px;color:#3b4670}
.trow.ev{padding-left:34px;font-size:13px}
.trow .tid,.trow .tg{margin-left:auto;font-size:11px;color:var(--mut);font-weight:400}
.dot{width:8px;height:8px;border-radius:50%;background:#c9d2ee;flex:none}.dot.bad{background:var(--bad)}.dot.good{background:var(--good)}
.crumb{color:var(--mut);font-size:12px;margin-bottom:4px}
h2{margin:0 0 8px;font-size:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
.fld{display:block;margin-bottom:8px}
.fld>span{display:block;font-size:12px;font-weight:600;color:var(--mut);margin-bottom:2px}
.hint{font-size:12px;color:var(--mut)}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}
.step{--c:#8a93b8;background:#fff;border:1px solid var(--line);border-left:5px solid var(--c);border-radius:12px;padding:8px 12px 10px;margin-bottom:8px}
.step.t-ask{--c:var(--pri)}.step.t-minigame{--c:#8b5cf6}.step.t-cutscene{--c:#14a3a3}.step.t-result{--c:#e0a21a}
.shead{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.shead .tag{font-weight:800;color:var(--c);min-width:84px}
.sid{font:11px ui-monospace,Consolas,monospace;color:var(--mut)}
.shead select.mini{width:auto;padding:2px 4px;font-size:12px}
.shead select.tsel{width:auto;padding:2px 4px;font-size:12px;font-weight:700}
.row-sp{display:grid;grid-template-columns:130px 1fr;gap:8px}
.opts{margin-top:6px;border-top:1px dashed var(--line);padding-top:6px}
.opt{border:1px solid var(--line);border-radius:10px;padding:6px 8px;margin-bottom:6px;background:#fafbff}
.orow{display:grid;grid-template-columns:minmax(120px,1fr) auto 175px 96px auto;gap:6px;align-items:center}
.seg{display:flex}
.seg button{padding:4px 8px;border:1px solid var(--line);background:#fff;font-size:12px;font-weight:700;color:var(--mut)}
.seg button:first-child{border-radius:8px 0 0 8px}.seg button:last-child{border-radius:0 8px 8px 0}.seg button+button{border-left:0}
.seg button.on.good{background:var(--good);border-color:var(--good);color:#fff}
.seg button.on.fair{background:var(--fair);border-color:var(--fair);color:#fff}
.seg button.on.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.res{margin-top:6px;border-radius:10px;padding:8px;background:#fff8e1;border:1px solid #f1dfa6}
.res .grid2{gap:8px}
.issue{font-size:12px;color:var(--bad);margin-top:4px}.issue.w{color:#9a6a00}
.ibtn{border:0;background:transparent;color:var(--mut);padding:2px 5px;border-radius:6px;font-size:12px}
.ibtn:hover{background:#eef1fa;color:var(--ink)}
.ibtn.x:hover{color:var(--bad)}
.addbar{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 14px}
textarea.quick{min-height:90px;font-family:ui-monospace,Consolas,monospace;font-size:13px}
table{border-collapse:collapse;width:100%;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:13px}
th{background:#f0f3ff;font-size:12px;color:var(--mut)}
td.dn{width:44px;text-align:center}td input[type=checkbox]{width:auto}
pre.script{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;font:12px/1.5 ui-monospace,Consolas,monospace;white-space:pre-wrap;max-height:60vh;overflow:auto}
.ptop{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.ptop select{width:auto}
.stage{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:linear-gradient(#8fd0ff,#ffe6bf);box-shadow:0 4px 0 rgba(0,0,0,.15)}
.slabel{position:absolute;left:10px;top:8px;padding:2px 10px;border-radius:999px;background:rgba(255,255,255,.85);font-size:12px;font-weight:700}
.dlgp{position:absolute;left:10px;right:10px;bottom:10px;background:#fff;border-radius:14px;padding:8px 12px 10px;box-shadow:0 3px 0 rgba(0,0,0,.2);max-height:88%;overflow:auto}
.who{display:inline-block;padding:0 10px;border-radius:999px;background:#ffe9a8;color:#5b4300;font-weight:800;font-size:12px}
.ptx{margin:4px 0 8px;font-weight:700;font-size:15px}
.pbtns{display:flex;gap:6px;flex-wrap:wrap}
.pb{padding:7px 12px;border:2px solid var(--line);border-radius:12px;background:#fff;font-weight:700;text-align:left}
.pb:hover{border-color:var(--pri)}.pb:disabled{opacity:.35;cursor:default}
.pb.go{background:var(--pri);border-color:var(--pri);color:#fff}
.pres{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:14px 18px;background:#fff;border-top:6px solid var(--c)}
.pres h3{margin:0 0 4px;font-size:18px}.pres p{margin:0 0 6px}
.pres .rb{align-self:flex-start;padding:0 10px;border-radius:999px;color:#fff;font-size:12px;font-weight:800;margin-bottom:4px}
.pres .tip{background:#fff6d6;border-radius:8px;padding:5px 8px;font-size:13px;margin-bottom:8px}
.pdesc{position:absolute;left:10px;right:10px;top:34px;bottom:10px;display:flex;flex-direction:column;justify-content:flex-end;gap:8px}
.pbox{background:rgba(255,255,255,.9);border:2px dashed #8b5cf6;border-radius:12px;padding:8px 10px;white-space:pre-wrap;font-size:13px;max-height:100%;overflow:auto}
.pbox.cut{border-color:#14a3a3;font-style:italic}
.pmeta{margin-top:8px;font-size:12px;color:var(--mut)}
#checks{position:fixed;right:14px;top:52px;width:430px;max-height:70vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(31,42,77,.2);padding:10px;z-index:20}
#checks .ci{padding:6px 8px;border-radius:8px;cursor:pointer;font-size:13px}#checks .ci:hover{background:#f0f3ff}
#checks .ci b.e{color:var(--bad)}#checks .ci b.w{color:#9a6a00}
.empty{padding:40px 10px;text-align:center;color:var(--mut)}
@media (max-width:1100px){main{grid-template-columns:200px minmax(0,1fr) 330px}main.wide{grid-template-columns:200px minmax(0,1fr)}.orow{grid-template-columns:1fr auto}}
#saved.bad{color:var(--bad);font-weight:600}
.peers{display:inline-flex;align-items:center}
.peer{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;color:#fff;font-size:10px;font-weight:800;margin-left:4px;flex:none}
.trow .peer{width:18px;height:18px;font-size:9px;margin-left:4px}
.peerbar{background:#fff3cf;border:1px solid #f1dfa6;border-radius:10px;padding:6px 10px;margin-bottom:10px;font-size:13px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.peerbar[hidden]{display:none}
.aname{font-size:11px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}
#login{position:fixed;inset:0;z-index:50;background:#eef1fa;display:flex;align-items:center;justify-content:center}
#login[hidden]{display:none}
#login form{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;width:340px;box-shadow:0 8px 24px rgba(31,42,77,.15)}
#login h2{margin:0 0 4px}#login .fld{margin-top:10px}
#login-msg{min-height:18px;margin:8px 0 0;font-size:13px;color:var(--bad)}
.bi{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bi .fld{margin-bottom:6px}
.aud{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:4px}
.aud audio{height:30px;width:210px}
.taskhead{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.card.taskdone{background:#f1faf4;border-color:#cfe9d9}
@media (max-width:900px){.bi{grid-template-columns:1fr}}
</style></head><body>
<header id="top"></header>
<main id="app"><aside id="tree"></aside><section id="center"></section><aside id="preview"></aside></main>
<div id="checks" hidden></div>
<datalist id="dl-speakers"></datalist><datalist id="dl-go"></datalist>
<input type="file" id="file" accept=".json,application/json" hidden>
<input type="file" id="assetfile" accept="audio/*,.mp3,.ogg,.m4a,.wav,.aac" hidden>
<div id="login"><form id="login-form" autocomplete="on"><h2>Bon Day - Flow Writer</h2><div class="hint">Team sign-in. Ask the PM if you need an account.</div>
<label class="fld"><span>Email</span><input id="login-email" type="email" autocomplete="username" required></label>
<label class="fld"><span>Password</span><input id="login-pass" type="password" autocomplete="current-password" required></label>
<p id="login-msg" style="color:var(--mut)">Connecting...</p><button class="btn pri" style="width:100%;margin-top:6px" type="submit">Sign in</button></form></div>

  try{

  else{try{const raw=localStorage.getItem(KEY);if(raw)d=JSON.parse(raw)}catch(e){}}

/* ---------- lookups ---------- */
function allEvents(){const o=[];S.levels.forEach(lv=>lv.scenes.forEach(sc=>sc.events.forEach(ev=>o.push({lv,sc,ev}))));return o}

  if(first)ui.sel={t:'event',id:first.ev.id};

function uid(prefix,ids){let n=nextNum(prefix,ids);while(ids.includes(prefix+n))n++;return prefix+n}
const allIds=(kind)=>{
  if(kind==='level')return S.levels.map(l=>l.id);

/* ---------- checks ---------- */
function runChecks(){
  const out=[],names={};
  allEvents().forEach(({ev})=>{names[ev.name]=(names[ev.name]||0)+1});
  allEvents().forEach(({lv,sc,ev})=>{
    const add=(sev,msg,st)=>out.push({sev,msg,ev:ev.id,st:st?st.id:null,where:(lv.titleEn||lv.id)+' / '+(ev.name||ev.id)});
    if(!ev.name)add('error','Event has no name');else if(names[ev.name]>1)add('error','Duplicate event name');
    if(ev.trigger==='on_approach'&&!ev.gameobject)add('error','on_approach needs a gameobject');
    if(ev.trigger==='on_condition'&&(!ev.condType||!ev.condParam))add('error','on_condition needs a condition type and parameter');
    if(!ev.steps.length)add('error','Event has no steps');
    ev.steps.forEach((st,i)=>{
      const n='Step '+(i+1)+': ';
      if((st.type==='say'||st.type==='ask')){
        if(!st.text.trim())add('error',n+'text is empty',st);
        else if(st.text.length>90)add('warn',n+'text is over 90 characters ('+st.text.length+')',st);
      }
      if((st.type==='minigame'||st.type==='cutscene')&&!st.text.trim())add('error',n+'description is empty',st);
      if(st.type==='ask'){
        if(st.options.length<2)add('error',n+'needs at least 2 options',st);
        if(!st.options.some(o=>o.next==='DONE'||String(o.next).startsWith('GOTO:')))add('error',n+'no option lets the player move on (need DONE or GOTO)',st);
        st.options.forEach((o,j)=>{
          const m=n+'option '+(j+1)+': ';
          if(!o.text.trim())add('error',m+'button text is empty',st);
          if(String(o.next).startsWith('GOTO:')&&!ev.steps.some(x=>x.id===o.next.slice(5)))add('error',m+'GOTO target step is missing',st);
          if(o.result)resCheck(o.result,m,st,add);
        });
      }
      if(st.type==='result'){if(st.result)resCheck(st.result,n,st,add);else add('error',n+'result is missing',st)}
    });
  });
  return out.concat(mediaIssues());
}
function resCheck(r,m,st,add){
  if(!r.title.trim()||!r.text.trim())add('error',m+'result needs a title and text',st);

const RF=[{b:'title'},{b:'text'},{b:'tip'}],QF=['question','correct','wrong1','wrong2','explanation'].map(b=>({b}));
function mediaItems(levels){
  const out=[];
  (levels||S.levels).forEach(lv=>{
    const ln=lv.titleEn||lv.id;
    out.push({owner:lv.id,o:lv,fields:[{b:'title',vi:'titleVi',en:'titleEn'},{b:'lesson',vi:'lesson',en:'lessonEn'}],where:'Level',lvName:ln,lv:lv.id,group:'lv:'+lv.id});
    (lv.quiz||[]).forEach(q=>out.push({owner:q.id,o:q,fields:QF,where:'Quiz '+q.id,lvName:ln,lv:lv.id,group:'lv:'+lv.id}));
    lv.scenes.forEach(sc=>sc.events.forEach(ev=>{
      const base={lvName:ln,lv:lv.id,ev:ev.id,group:'ev:'+ev.id,evName:ev.name};
      ev.steps.forEach(st=>{
        if(st.type==='say'||st.type==='ask')out.push({...base,owner:st.id,o:st,fields:[{b:'text'}],where:ev.name+' / '+st.id});
        if(st.type==='result'&&st.result)out.push({...base,owner:st.id+'_result',o:st.result,fields:RF,where:ev.name+' / '+st.id+' result'});
        (st.options||[]).forEach(o=>{
          out.push({...base,owner:o.id,o,fields:[{b:'text'}],where:ev.name+' / '+o.id});
          if(o.result)out.push({...base,owner:o.id+'_result',o:o.result,fields:RF,where:ev.name+' / '+o.id+' result'});
        });
      });
    }));
  });
  return out;
}
const fVi=f=>f.vi||f.b,fEn=f=>f.en||f.b+'En';
function mediaStats(){
  let tot=0,en=0,av=0,ae=0;
  mediaItems().forEach(it=>it.fields.forEach(f=>{
    if(!String(it.o[fVi(f)]||'').trim())return;
    tot++;if(String(it.o[fEn(f)]||'').trim())en++;
    const a=it.o.aud||{};if(a[f.b+'_vi'])av++;if(a[f.b+'_en'])ae++;
  }));
  return{tot,en,av,ae};
}
function mediaIssues(){
  const g={};
  mediaItems().forEach(it=>it.fields.forEach(f=>{
    if(!String(it.o[fVi(f)]||'').trim())return;
    const r=g[it.group]=g[it.group]||{it,en:0,av:0,ae:0};
    const hasEn=!!String(it.o[fEn(f)]||'').trim(),a=it.o.aud||{};
    if(!hasEn)r.en++;if(!a[f.b+'_vi'])r.av++;if(hasEn&&!a[f.b+'_en'])r.ae++;
  }));
  const out=[];
  Object.values(g).forEach(r=>{
    if(!(r.en||r.av||r.ae))return;
    const parts=[];if(r.en)parts.push('EN text '+r.en);if(r.av)parts.push('VI audio '+r.av);if(r.ae)parts.push('EN audio '+r.ae);
    out.push({sev:'warn',quiet:true,msg:'Missing: '+parts.join(', '),ev:r.it.ev||null,st:null,lvId:r.it.lv,where:r.it.lvName+' / '+(r.it.evName||'Level and quiz')});
  });
  return out;
}

function quickWrite(evId){

  const lines=ta.value.split('\n').map(x=>x.trim()).filter(Boolean);if(!lines.length)return;

      else if((m=line.match(/^cutscene:\s*(.+)$/i))){const s=mkStep(f.ev,'cutscene');s.text=m[1];f.ev.steps.push(s);lastAsk=null}
      else if((m=line.match(/^[-•]\s*(.+)$/))){
        if(!lastAsk)return;

        const o=mkOpt(lastAsk,RATINGS.includes((parts[1]||'').toLowerCase())?parts[1].toLowerCase():'good','DONE');

        if(s.speaker&&!S.speakers.includes(s.speaker))S.speakers.push(s.speaker);

}

const canon=o=>JSON.stringify(sortKeys(o));
function sortKeys(o){
  if(Array.isArray(o))return o.map(sortKeys);
  if(o&&typeof o==='object'){const r={};Object.keys(o).sort().forEach(k=>{if(o[k]!==undefined)r[k]=sortKeys(o[k])});return r}
  return o;
}
const deepEq=(a,b)=>canon(a)===canon(b);
const isObj=o=>!!o&&typeof o==='object'&&!Array.isArray(o);
const idLike=a=>Array.isArray(a)&&a.every(x=>isObj(x)&&typeof x.id==='string');

/* three-way merge: base = last synced, local = my copy, remote = server copy */
function merge(base,local,remote){
  if(deepEq(local,remote))return local;
  if(deepEq(local,base))return remote;
  if(deepEq(remote,base))return local;
  if(isObj(local)&&isObj(remote)){
    const b=isObj(base)?base:{},out={};
    new Set([...Object.keys(local),...Object.keys(remote)]).forEach(k=>{
      const inL=k in local,inR=k in remote;let v;
      if(inL&&inR)v=merge(b[k],local[k],remote[k]);
      else if(inL)v=(k in b)&&deepEq(local[k],b[k])?undefined:local[k];
      else v=(k in b)&&deepEq(remote[k],b[k])?undefined:remote[k];
      if(v!==undefined)out[k]=v;
    });
    return out;
  }
  if(Array.isArray(local)&&Array.isArray(remote)){
    if(idLike(local)&&idLike(remote))return mergeById(idLike(base)?base:[],local,remote);
    if(local.every(x=>typeof x==='string')&&remote.every(x=>typeof x==='string')){
      const b=Array.isArray(base)?base:[];
      const gone=new Set(b.filter(x=>!local.includes(x)||!remote.includes(x)));
      const out=local.filter(x=>!gone.has(x));
      remote.forEach(x=>{if(!gone.has(x)&&!out.includes(x))out.push(x)});
      return out;
    }
  }
  return local;
}
function mergeById(base,local,remote){
  const bm=new Map(base.map(x=>[x.id,x])),lm=new Map(local.map(x=>[x.id,x])),rm=new Map(remote.map(x=>[x.id,x]));
  const lIds=local.map(x=>x.id),rIds=remote.map(x=>x.id),bIds=base.map(x=>x.id);
  const res=new Map();
  new Set([...lIds,...rIds]).forEach(id=>{
    const l=lm.get(id),r=rm.get(id),b=bm.get(id);
    if(l&&r)res.set(id,merge(b||{},l,r));
    else if(l){if(!(b&&deepEq(l,b)))res.set(id,l)}
    else if(r){if(!(b&&deepEq(r,b)))res.set(id,r)}
  });
  const common=bIds.filter(id=>lm.has(id)&&rm.has(id));
  const lOrd=lIds.filter(id=>common.includes(id)),rOrd=rIds.filter(id=>common.includes(id));
  const skel=deepEq(lOrd,common)?rIds:lIds;
  const order=skel.filter(id=>res.has(id));
  [lIds,rIds].forEach(src=>src.forEach((id,i)=>{
    if(res.has(id)&&!order.includes(id)){let j=i-1;while(j>=0&&!order.includes(src[j]))j--;order.splice(j>=0?order.indexOf(src[j])+1:0,0,id)}
  }));
  return order.map(id=>res.get(id));
}

  if(!b){
    const{data:row,error}=await sb.from(TBL).insert({id,data,rev:1,updated_by:by}).select().single();
    if(error){if(error.code==='23505'&&tries<4){await refetchOne(id);return pushDoc(id,tries+1)}throw error}
    SB.docs[id]=rowBase(row);return;
  }
  const{data:rows,error}=await sb.from(TBL).update({data,rev:b.rev+1,updated_at:new Date().toISOString(),updated_by:by}).eq('id',id).eq('rev',b.rev).select();
  if(error)throw error;
  if(!rows||!rows.length){if(tries>=4)throw new Error('conflict');await refetchOne(id);return pushDoc(id,tries+1)}
  SB.docs[id]=rowBase(rows[0]);
}
async function pushNow(){
  if(!SB.ready)return;
  if(SB.pushing){SB.again=true;return}
  SB.pushing=true;clearTimeout(SB.retry);setStatus('saving');
  try{
    do{
      SB.again=false;
      const want=localDocs();
      for(const id of Object.keys(want)){
        const b=SB.docs[id];if(b&&b.json===canon(want[id]))continue;
        await pushDoc(id,0);
      }
      /* only a level the user deleted in this session is removed from the server; a doc that is merely
         missing locally (older tool version, partial state) is never deleted */
      for(const id of Object.keys(SB.docs)){
        if(!(id in want)&&SB.delLevels.has(id)){const{error}=await SB.client.from(TBL).delete().eq('id',id);if(error)throw error;delete SB.docs[id];SB.delLevels.delete(id)}
      }
    }while(SB.again);
    saveBase();setStatus('synced');
  }catch(e){console.warn('sync push failed',e);setStatus('error');SB.retry=setTimeout(pushNow,8000)}
  SB.pushing=false;
}
function trackLevelDeletes(){
  const now=new Set(S.levels.map(l=>'level:'+l.id));
  SB.prevLevels.forEach(id=>{if(!now.has(id))SB.delLevels.add(id)});
  now.forEach(id=>SB.delLevels.delete(id));
  SB.prevLevels=now;
}
function onLocalChange(){
  if(!SB.ready)return;
  trackLevelDeletes();
  setStatus('saving');clearTimeout(SB.timer);SB.timer=setTimeout(pushNow,400);
}

/* ---------- pull / realtime ---------- */
async function refetchOne(id){
  const{data,error}=await SB.client.from(TBL).select('*').eq('id',id).maybeSingle();
  if(error)throw error;
  reconcileOne(id,data||null);
}
async function refetchAll(){
  if(!SB.ready)return;
  try{const{data,error}=await SB.client.from(TBL).select('*');if(error)throw error;
    const before=JSON.stringify(S);reconcile(data||[]);
    if(JSON.stringify(S)!==before)renderKeepFocus();
    if(!SB.pushing)pushNow();
  }catch(e){console.warn('refetch failed',e)}
}
function onRemote(p){
  const ev=p.eventType,row=p.new&&p.new.id?p.new:null,id=(row&&row.id)||(p.old&&p.old.id);
  if(!id||(!SB.ready))return;
  const b=SB.docs[id];
  if(ev==='DELETE'){if(!b)return;reconcileOne(id,null)}
  else{
    if(b&&row.rev<=b.rev)return;
    if(row.data===undefined||row.data===null){refetchOne(id).then(()=>renderKeepFocus());return}
    reconcileOne(id,row);
  }
  renderKeepFocus();
  if(!SB.pushing){const w=localDocs();if(Object.keys(w).some(k=>!SB.docs[k]||SB.docs[k].json!==canon(w[k]))||Object.keys(SB.docs).some(k=>!(k in w)))onLocalChange()}
}

async function storageReport(clean){
  const sb=SB.client.storage.from(BUCKET),used=new Set();eachAudio(a=>used.add(a.path));
  const top=await sb.list('',{limit:1000});if(top.error)throw top.error;
  let total=0,orphans=[];
  for(const f of top.data){
    if(f.id){total+=(f.metadata&&f.metadata.size)||0;if(!used.has(f.name))orphans.push({p:f.name,s:(f.metadata&&f.metadata.size)||0});continue}
    const sub=await sb.list(f.name,{limit:1000});if(sub.error)throw sub.error;
    sub.data.forEach(x=>{if(!x.id)return;const s=(x.metadata&&x.metadata.size)||0,p=f.name+'/'+x.name;total+=s;if(!used.has(p))orphans.push({p,s})});
  }
  const orphanSize=orphans.reduce((a,x)=>a+x.s,0);
  let msg='Storage used: '+(total/1048576).toFixed(1)+' MB of 1024 MB (free plan). Unused files: '+orphans.length+' ('+(orphanSize/1048576).toFixed(1)+' MB).';
  if(clean&&orphans.length&&confirm(msg+'\nDelete the unused files now? This cannot be undone.')){
    const r=await sb.remove(orphans.map(x=>x.p));if(r.error)throw r.error;msg='Deleted '+orphans.length+' unused files.';
  }

}

/* ---------- download JSON + files as one .zip (no compression, no library) ---------- */
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=CRC[(c^u8[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}
function makeZip(files){
  const enc=new TextEncoder(),parts=[],cd=[];let off=0;
  const d=new Date(),dt=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1),dd=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
  files.forEach(f=>{
    const nm=enc.encode(f.name),crc=crc32(f.data),sz=f.data.length;
    const h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(10,dt,true);h.setUint16(12,dd,true);h.setUint32(14,crc,true);h.setUint32(18,sz,true);h.setUint32(22,sz,true);h.setUint16(26,nm.length,true);
    parts.push(new Uint8Array(h.buffer),nm,f.data);
    const c=new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(12,dt,true);c.setUint16(14,dd,true);c.setUint32(16,crc,true);c.setUint32(20,sz,true);c.setUint32(24,sz,true);c.setUint16(28,nm.length,true);c.setUint32(42,off,true);
    cd.push(new Uint8Array(c.buffer),nm);off+=30+nm.length+sz;
  });
  const cdSize=cd.reduce((a,x)=>a+x.length,0),e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cdSize,true);e.setUint32(16,off,true);
  return new Blob([...parts,...cd,new Uint8Array(e.buffer)],{type:'application/zip'});
}
async function downloadZip(){
  const say=t=>{const m=$('#zip-msg');if(m)m.textContent=t},enc=new TextEncoder();
  const data=exportData();
  const levels=JSON.parse(JSON.stringify(data.levels.filter(l=>!ui.devLevel||l.id===ui.devLevel)));
  const list=[];eachAudio((a,owner,k)=>{a.file=zipName(owner,k,a);list.push(a)},levels);
  const files=[{name:'bon_day_flow.json',data:enc.encode(JSON.stringify({...data,levels},null,1))},{name:'bon_day_script.txt',data:enc.encode(scriptText(levels))}];
  const cache=new Map(),fail=[];let i=0;
  for(const a of list){
    say('Downloading audio '+(++i)+'/'+list.length+'...');
    try{
      let b=cache.get(a.path);
      if(!b){const r=await fetch(publicUrl(a.path));if(!r.ok)throw new Error(r.status);b=new Uint8Array(await r.arrayBuffer());cache.set(a.path,b)}
      files.push({name:a.file,data:b});
    }catch(e){fail.push(a.file)}
  }
  if(fail.length)files.push({name:'MISSING_FILES.txt',data:enc.encode(fail.join('\n'))});
  dl('bon_day_flow_'+new Date().toISOString().slice(0,10)+'.zip',makeZip(files),'application/zip');
  say('Done: '+(list.length-fail.length)+' audio files'+(fail.length?', '+fail.length+' could not be downloaded (see MISSING_FILES.txt)':'')+'.');
}

/* ---------- version history (restore from the server snapshots) ---------- */
function sumDoc(id,d){
  if(!d)return '';
  if(id==='tasks'){const it=d.items||[];return it.length+' tasks ('+it.filter(x=>x.done).length+' done)'}
  if(id==='meta')return (d.speakers||[]).length+' speakers, '+(d.levelIds||[]).length+' levels';
  let sc=0,ev=0,st=0;(d.scenes||[]).forEach(s=>{sc++;(s.events||[]).forEach(e=>{ev++;st+=(e.steps||[]).length})});
  return sc+' scenes, '+ev+' events, '+st+' steps, '+(d.quiz||[]).length+' quiz questions';
}
function detailDoc(id,d){

  if(id==='meta')return '<div>Speakers: '+esc((d.speakers||[]).join(', '))+'</div><div>Level order: '+esc((d.levelIds||[]).join(', '))+'</div>';

  o+='</table>';
  if(!h.rows.length)o+='<div class="empty">No versions saved yet for this part.</div>';
  const s=h.rows.find(r=>r.hid===h.sel);
  if(s)o+='<div class="card" style="margin-top:12px"><div class="bar"><b>Version from '+esc(fmtTime(s.updated_at))+'</b><span class="sp"></span>'+btn('histDownload','Download JSON',{hid:s.hid})+'</div>'+detailDoc(s.id,s.data)+'</div>';
  return o;
}

load();ensureSel();render();
initSync();
window.__app={get S(){return S},render,runChecks,startPlay,ui,merge,SB,canon,reconcile,localDocs,onRemote,pushNow,get ready(){return SB.ready}};
})();
